<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طلبات نقل المعدات</title>
    <!-- Tailwind CSS للتصميم السريع والاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة خطوط وأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- شريط التنقل العلوي للمحاكاة (التنقل بين دور Viewer و Admin) -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-truck-moving ml-2"></i> نظام إدارة ونقل المعدات</h1>
            <div class="flex gap-2">
                <button onclick="switchView('viewer')" id="btn-viewer" class="px-4 py-2 bg-blue-600 rounded-lg text-sm font-semibold transition">واجهة الفاحص (Viewer)</button>
                <button onclick="switchView('admin')" id="btn-admin" class="px-4 py-2 bg-slate-700 rounded-lg text-sm font-semibold transition relative">
                    واجهة الأدمن (Admin)
                    <span id="badge-count" class="absolute -top-1 -right-1 bg-red-500 text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">

        <!-- ================= قسم الفاحص (Viewer) ================= -->
        <section id="view-viewer" class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-solid fa-file-circle-plus text-blue-600 ml-2"></i> طلب نقل معدة جديدة</h2>
            
            <form id="transferForm" onsubmit="submitTransferRequest(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">اسم مقدم الطلب (Viewer)</label>
                    <input type="text" id="viewerName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل اسمك الكريم">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">اسم المعدة / الكود التعريفي</label>
                    <input type="text" id="equipmentName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="مثال: حفار كاتربيلر (EQ-104)">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المشروع الحالي</label>
                        <input type="text" id="currentProject" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="مشروع العاصمة الإدارية">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المشروع المطلوب نقله إليه</label>
                        <input type="text" id="targetProject" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="مشروع العلمين">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                    <i class="fa-solid fa-paper-plane ml-2"></i> إرسال الطلب للسيرفر
                </button>
            </form>
        </section>

        <!-- ================= قسم الأدمن (Admin) ================= -->
        <section id="view-admin" class="hidden max-w-5xl mx-auto bg-white p-6 rounded-2xl shadow-md">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-list-check text-blue-600 ml-2"></i> لوحة متابعة طلبات النقل الواردة</h2>
                <span id="live-indicator" class="text-xs bg-emerald-100 text-emerald-700 font-semibold px-3 py-1 rounded-full flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل (Live Sync)
                </span>
            </div>

            <!-- جدول الطلبات -->
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-sm">
                            <th class="p-3 rounded-r-lg">المعدة</th>
                            <th class="p-3">مقدم الطلب</th>
                            <th class="p-3">من مشروع</th>
                            <th class="p-3">إلى مشروع</th>
                            <th class="p-3">الوقت</th>
                            <th class="p-3">الحالة</th>
                            <th class="p-3 rounded-l-lg text-center">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody" class="text-sm divide-y divide-gray-100">
                        <!-- يتم حقن البيانات هنا برمجياً -->
                        <tr>
                            <td colspan="7" class="text-center py-6 text-gray-400">لا توجد طلبات جديدة حتى الآن</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- إشعار عائم فوري (Live Notification Toast) -->
    <div id="toastNotification" class="fixed bottom-5 left-5 bg-slate-900 text-white px-5 py-4 rounded-xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50 border-r-4 border-blue-500">
        <i class="fa-solid fa-bell text-blue-400 text-xl animate-bounce"></i>
        <div>
            <h4 class="font-bold text-sm" id="toastTitle">طلب نقل جديد!</h4>
            <p class="text-xs text-gray-300" id="toastDesc">تم استلام طلب نقل معدة جديد.</p>
        </div>
    </div>

    <!-- كود الجافاسكريبت الخاص بإدارة الحركات والتزامن الفوري -->
    <script>
        // تخزين مؤقت للطلبات (محاكاة قاعدة البيانات السحابية مثل Firebase أو WebSockets)
        let requests = JSON.parse(localStorage.getItem('equipment_requests')) || [];

        // تبديل الواجهات للمحاكاة
        function switchView(role) {
            const viewerSec = document.getElementById('view-viewer');
            const adminSec = document.getElementById('view-admin');
            const btnViewer = document.getElementById('btn-viewer');
            const btnAdmin = document.getElementById('btn-admin');

            if (role === 'viewer') {
                viewerSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                btnViewer.className = "px-4 py-2 bg-blue-600 rounded-lg text-sm font-semibold transition";
                btnAdmin.className = "px-4 py-2 bg-slate-700 rounded-lg text-sm font-semibold transition";
            } else {
                viewerSec.classList.add('hidden');
                adminSec.classList.remove('hidden');
                btnAdmin.className = "px-4 py-2 bg-blue-600 rounded-lg text-sm font-semibold transition";
                btnViewer.className = "px-4 py-2 bg-slate-700 rounded-lg text-sm font-semibold transition";
                
                // إخفاء الـ Badge عند فتح صفحة الأدمن
                document.getElementById('badge-count').classList.add('hidden');
                document.getElementById('badge-count').innerText = '0';
                renderAdminTable();
            }
        }

        // إرسال الطلب وحفظه في السيرفر (محاكاة)
        function submitTransferRequest(event) {
            event.preventDefault();

            const newReq = {
                id: Date.now(),
                viewerName: document.getElementById('viewerName').value,
                equipmentName: document.getElementById('equipmentName').value,
                currentProject: document.getElementById('currentProject').value,
                targetProject: document.getElementById('targetProject').value,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                status: 'معلق'
            };

            // حفظ البيانات (في النظام الحقيقي هنا يتم استخدام fetch() لإرسالها للـ API)
            requests.unshift(newReq);
            localStorage.setItem('equipment_requests', JSON.stringify(requests));

            // تفعيل محاكاة الإشعار الفوري للأدمن Live Notification
            triggerLiveNotification(newReq);

            // إعادة تعيين النموذج
            document.getElementById('transferForm').reset();
            alert('تم إرسال الطلب بنجاح إلى النظام!');
        }

        // محاكاة وصول إشعار فوري (Live Notification) عبر السيرفر
        function triggerLiveNotification(req) {
            // تحديث الـ Badge للأدمن
            const badge = document.getElementById('badge-count');
            let currentCount = parseInt(badge.innerText) || 0;
            badge.innerText = currentCount + 1;
            badge.classList.remove('hidden');

            // إظهار التنبيه البصري (Toast)
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastTitle').innerText = `طلب نقل معدة: ${req.equipmentName}`;
            document.getElementById('toastDesc').innerText = `من ${req.viewerName} إلى ${req.targetProject}`;
            
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 4000);

            // إذا كان الأدمن فاتح لوحة التحكم حالياً، يتم تحديث الجدول تلقائياً
            if (!document.getElementById('view-admin').classList.contains('hidden')) {
                renderAdminTable();
            }
        }

        // عرض جدول الأدمن
        function renderAdminTable() {
            const tbody = document.getElementById('requestsTableBody');
            if (requests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">لا توجد طلبات جديدة حتى الآن</td></tr>`;
                return;
            }

            tbody.innerHTML = requests.map(req => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-3 font-bold text-slate-800">${req.equipmentName}</td>
                    <td class="p-3 text-gray-600">${req.viewerName}</td>
                    <td class="p-3 text-gray-600">${req.currentProject}</td>
                    <td class="p-3 text-blue-600 font-semibold">${req.targetProject}</td>
                    <td class="p-3 text-gray-400 text-xs">${req.time}</td>
                    <td class="p-3">
                        <span class="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-bold">${req.status}</span>
                    </td>
                    <td class="p-3 text-center flex justify-center gap-2">
                        <button onclick="updateStatus(${req.id}, 'موافق')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs">موافقة</button>
                        <button onclick="updateStatus(${req.id}, 'مرفوض')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs">رفض</button>
                    </td>
                </tr>
            `).join('');
        }

        // تحديث حالة الطلب
        function updateStatus(id, newStatus) {
            requests = requests.map(r => r.id === id ? { ...r, status: newStatus } : r);
            localStorage.setItem('equipment_requests', JSON.stringify(requests));
            renderAdminTable();
        }

        // تحميل الجدول عند فتح الصفحة أول مرة
        window.onload = function() {
            if (requests.length > 0 && !document.getElementById('view-admin').classList.contains('hidden')) {
                renderAdminTable();
            }
        };
    </script>
</body>
</html>
