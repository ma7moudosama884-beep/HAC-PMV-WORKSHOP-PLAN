<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PMV Workshop Plan</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Add Equipment</h2>
  <form id="eq-form" style="display:flex; gap:10px; flex-wrap:wrap;">
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="code" placeholder="Code" required>
    <select id="dept">
      <option value="Mechanics">Mechanics</option>
      <option value="Welding">Welding</option>
      <option value="Electric">Electric</option>
    </select>
    <select id="status">
      <option value="Ready">Ready</option>
      <option value="In Progress">In Progress</option>
    </select>
    <button type="submit">Add</button>
  </form>
</div>

<div class="card">
  <div class="filter-bar">
    <input type="text" id="search-code" placeholder="Filter by Code..." oninput="renderTable()">
    <select id="filter-status" onchange="renderTable()">
      <option value="All">All Status</option>
      <option value="Ready">Ready</option>
      <option value="In Progress">In Progress</option>
    </select>
    <select id="filter-dept" onchange="renderTable()">
      <option value="All">All Depts</option>
      <option value="Mechanics">Mechanics</option>
      <option value="Welding">Welding</option>
      <option value="Electric">Electric</option>
    </select>
  </div>

  <table>
    <thead>
      <tr><th>Name</th><th>Code</th><th>Dept</th><th>Status</th></tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
  let data = JSON.parse(localStorage.getItem("pmv_data")) || [];

  document.getElementById("eq-form").onsubmit = (e) => {
    e.preventDefault();
    data.push({
      name: document.getElementById("name").value,
      code: document.getElementById("code").value,
      dept: document.getElementById("dept").value,
      status: document.getElementById("status").value
    });
    localStorage.setItem("pmv_data", JSON.stringify(data));
    renderTable();
    e.target.reset();
  };

  function renderTable() {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = "";
    
    const search = document.getElementById("search-code").value.toLowerCase();
    const status = document.getElementById("filter-status").value;
    const dept = document.getElementById("filter-dept").value;

    data.filter(item => 
      (item.code.toLowerCase().includes(search)) &&
      (status === "All" || item.status === status) &&
      (dept === "All" || item.dept === dept)
    ).forEach(item => {
      tbody.innerHTML += `<tr><td>${item.name}</td><td>${item.code}</td><td>${item.dept}</td><td>${item.status}</td></tr>`;
    });
  }

  renderTable();
</script>

</body>
</html>
