<!-- قم بتحديث جزء الـ Header Control والـ Filter داخل الـ HTML كالتالي: -->

<!-- 1. تحديث قائمة الأقسام في نموذج الإضافة -->
<div class="form-group">
  <label>Department / Workshop Stage</label>
  <select id="eq-dept" required>
    <option value="Mechanics">Mechanics</option>
    <option value="Denting">Denting</option>
    <option value="Blacksmith">Blacksmith</option>
    <option value="Welding">Welding (الحدادة)</option>
    <option value="Painting">Painting</option>
    <option value="Electric">Electric</option>
    <option value="Testing">Testing</option>
  </select>
</div>

<!-- 2. تحديث قسم الفلترة في الـ Table Panel -->
<div class="filter-container" style="gap: 15px;">
  <input type="text" id="code-search" placeholder="Search by Code..." onkeyup="render()" style="padding: 5px; border: 1px solid var(--border-color); border-radius: 4px;">
  
  <select id="status-filter" onchange="render()">
    <option value="All">All Status</option>
    <option value="Ready">Ready</option>
    <option value="In Progress">In Progress</option>
    <option value="Waiting">Waiting</option>
    <option value="Delay">Delay</option>
    <option value="Dispatched">Dispatched</option>
  </select>

  <select id="dept-filter" onchange="render()">
    <option value="All">All Departments</option>
    <option value="Mechanics">Mechanics</option>
    <option value="Denting">Denting</option>
    <option value="Blacksmith">Blacksmith</option>
    <option value="Welding">Welding</option>
    <option value="Painting">Painting</option>
    <option value="Electric">Electric</option>
    <option value="Testing">Testing</option>
  </select>
</div>

<script>
// 3. تحديث دالة الـ render لتشمل الفلترة المتعددة
function render() {
  tableBody.innerHTML = "";
  
  // قيم الفلتر
  const codeSearch = document.getElementById("code-search").value.toLowerCase();
  const statusFilter = document.getElementById("status-filter").value;
  const deptFilter = document.getElementById("dept-filter").value;

  // الفلترة
  const filteredEquipment = equipmentList.filter(item => {
    const matchCode = item.code.toLowerCase().includes(codeSearch);
    const matchStatus = (statusFilter === "All" || item.status === statusFilter);
    const matchDept = (deptFilter === "All" || item.dept === deptFilter);
    return matchCode && matchStatus && matchDept;
  });

  // عرض البيانات المفلترة
  filteredEquipment.forEach((item) => {
    const statusClass = item.status.replace(/\s+/g, '-');
    const icon = deptIcons[item.dept] || "🔧";
    
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><strong>${item.name}</strong></td>
      <td><code><strong>${item.code}</strong></code></td>
      <td>📅 ${item.entryDate}</td>
      <td>${item.exitDate || "-"}</td>
      <td><span class="duration-badge">${calculateDuration(item.entryDate, item.exitDate)}</span></td>
      <td>${icon} ${item.dept}</td>
      <td><span class="status-badge status-${statusClass}">${item.status}</span></td>
      <td class="admin-action-col">
        <div class="action-btns">
          <button class="btn-edit" onclick="editEquipment(${item.id})">Edit</button>
          <button class="btn-delete" onclick="deleteEquipment(${item.id})">Delete</button>
        </div>
      </td>
    `;
    tableBody.appendChild(row);
  });
  
  // ... باقي الكود كما هو
}

// إضافة الأيقونة في مصفوفة الـ icons
const deptIcons = {
  "Mechanics": "🛠️",
  "Denting": "🔨",
  "Blacksmith": "⚒️",
  "Welding": "🔥", 
  "Painting": "🎨",
  "Electric": "⚡",
  "Testing": "🧪"
};
</script>
