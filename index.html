<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMV Workshop Plan - Hassan Allam Construction</title>
  <style>
    :root {
      --bg-color: #f4f6f8; --card-bg: #ffffff; --navy: #002b49; --text-main: #333333;
      --text-muted: #666666; --border-color: #e0e0e0; --status-ready: #2ecc71;
      --status-delay: #e74c3c; --status-progress: #3498db; --status-external: #9b59b6;
      --status-waiting: #f39c12; --status-dispatched: #7f8c8d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Login Styles */
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--navy); display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
    .login-card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 380px; text-align: center; }
    
    header { background: #ffffff; border-bottom: 3px solid var(--navy); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .logo-container { display: flex; align-items: center; gap: 15px; }
    .logo-container img { height: 40px; }
    
    .container { padding: 25px; max-width: 1400px; margin: 0 auto; flex: 1; width: 100%; }
    .form-panel { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .table-panel { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background-color: #f8f9fa; color: var(--navy); }
    
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .btn-add { background: var(--navy); color: #fff; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
    .btn-edit { background: var(--status-progress); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .btn-delete { background: var(--status-delay); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Login (Simplified for brevity) -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>PMV Workshop Login</h2>
      <input type="text" id="login-user" placeholder="Username" style="width:100%; padding:10px; margin:10px 0;"><br>
      <input type="password" id="login-pass" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;"><br>
      <button onclick="login()" class="btn-add" style="width:100%">Login</button>
    </div>
  </div>

  <header>
    <div class="logo-container"><h1>PMV Workshop Plan</h1></div>
    <button class="btn-add" onclick="manualSaveData()">💾 Save All Data</button>
  </header>

  <div class="container">
    <!-- Form -->
    <div class="form-panel">
      <h2 id="form-title">Add New Equipment</h2>
      <form id="equipment-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
        <input type="hidden" id="edit-id">
        <input type="text" id="eq-name" placeholder="Equipment Name" required>
        <input type="text" id="eq-project" placeholder="Project Name" required>
        <input type="text" id="eq-code" placeholder="Code" required>
        <input type="date" id="eq-entry-date" required>
        <select id="eq-dept">
          <option value="Mechanics">Mechanics</option><option value="Welding">Welding</option>
          <option value="Denting">Denting</option><option value="Painting">Painting</option>
        </select>
        <select id="eq-status">
          <option value="Ready">Ready</option><option value="In Progress">In Progress</option>
          <option value="Waiting">Waiting</option><option value="Dispatched">Dispatched</option>
        </select>
        <button type="submit" class="btn-add">Save Entry</button>
      </form>
    </div>

    <!-- Table -->
    <div class="table-panel">
      <div class="filter-bar">
        <input type="text" id="f-code" placeholder="Search Code/Name..." onkeyup="render()">
        <input type="text" id="f-project" placeholder="Search Project..." onkeyup="render()">
        <select id="f-status" onchange="render()">
          <option value="All">All Status</option><option value="Ready">Ready</option>
          <option value="In Progress">In Progress</option><option value="Dispatched">Dispatched</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Project</th>
            <th>Code</th>
            <th>Dept</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let equipmentList = JSON.parse(localStorage.getItem("pmv_data")) || [];

    function render() {
      const codeSearch = document.getElementById("f-code").value.toLowerCase();
      const projSearch = document.getElementById("f-project").value.toLowerCase();
      const statusF = document.getElementById("f-status").value;

      const body = document.getElementById("table-body");
      body.innerHTML = "";

      equipmentList.filter(item => 
        (item.code.toLowerCase().includes(codeSearch) || item.name.toLowerCase().includes(codeSearch)) &&
        (item.project.toLowerCase().includes(projSearch)) &&
        (statusF === "All" || item.status === statusF)
      ).forEach(item => {
        body.innerHTML += `<tr>
          <td>${item.name}</td>
          <td><strong>${item.project}</strong></td>
          <td>${item.code}</td>
          <td>${item.dept}</td>
          <td><span class="status-badge">${item.status}</span></td>
          <td>
            <button class="btn-edit" onclick="editEq(${item.id})">Edit</button>
            <button class="btn-delete" onclick="deleteEq(${item.id})">Delete</button>
          </td>
        </tr>`;
      });
    }

    document.getElementById("equipment-form").onsubmit = function(e) {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const data = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById("eq-name").value,
        project: document.getElementById("eq-project").value,
        code: document.getElementById("eq-code").value,
        dept: document.getElementById("eq-dept").value,
        status: document.getElementById("eq-status").value
      };

      if(id) {
        equipmentList = equipmentList.map(item => item.id == id ? data : item);
      } else {
        equipmentList.push(data);
      }
      this.reset();
      document.getElementById("edit-id").value = "";
      localStorage.setItem("pmv_data", JSON.stringify(equipmentList));
      render();
    };

    function editEq(id) {
      const item = equipmentList.find(i => i.id == id);
      document.getElementById("edit-id").value = item.id;
      document.getElementById("eq-name").value = item.name;
      document.getElementById("eq-project").value = item.project;
      document.getElementById("eq-code").value = item.code;
      render();
    }

    function deleteEq(id) {
      if(confirm("Delete?")) {
        equipmentList = equipmentList.filter(i => i.id != id);
        localStorage.setItem("pmv_data", JSON.stringify(equipmentList));
        render();
      }
    }

    function login() { document.getElementById("login-overlay").style.display = "none"; }
    function manualSaveData() { localStorage.setItem("pmv_data", JSON.stringify(equipmentList)); alert("Saved!"); }
    
    render();
  </script>
</body>
</html>
